name: myfinance_flutter
description: MyFinance personal and household finance app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  material_ui: ^1.11.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/appLogo.png
    - assets/appBanner.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appLogo.png"
  min_sdk_android: 21
